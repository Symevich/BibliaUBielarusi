<!DOCTYPE html>
<html lang="be">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exhibit</title>
    <link rel="stylesheet" href="../../styles/normalize.css" />
    <link rel="stylesheet" href="../../styles/style.css" />
  </head>

  <body>
    <div id="back-container"></div>
    <div class="lang-switch">
      <div id="lang-btn"></div>
    </div>

    <div id="container" class="container"></div>

    <script src="../js/exhibit.js"></script>

    <script>
      // read parameters from URL
      const params1 = new URLSearchParams(window.location.search);
      const section1 = params1.get("section");
      const id1 = params1.get("id");

      // generate "Back" button
      const langBlock1 = `
      <button class="lang-btn">
          <a href="../../be/html/exhibit.html?section=${section1}&id=${id1}">Беларуская</a>
      </button>
      <button class="lang-btn">
          <a href="../../en/html/exhibit.html?section=${section1}&id=${id1}">English</a>
      </button>
      `;
      document.getElementById("lang-btn").innerHTML = langBlock1;
    </script>
  </body>
</html>
